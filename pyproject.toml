[project]
name = "ms_stt"
version = "0.1.0"
description = "Local STT microservice with Whisper and Vosk"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.162.5",
    "faster-whisper>=1.2.1",
    "loguru>=0.8.0",
    "sounddevice>=0.5.6",
    "uvicorn[standard]>=0.54.0",
    "vosk>=0.3.45",
    "onnx-asr>=0.4.0",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
]
